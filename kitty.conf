# iddqdkittyconf — kitty settings

include iddqdkittyconf.conf

font_family      Hack
font_size        15.0
cursor_shape     block
cursor_shape_unfocused block
cursor_blink_interval 0.5
cursor_trail 3
text_composition_strategy 1.0 0

shell_integration no-cursor no-title

modify_font cell_height 135%
window_padding_width 8
undercurl_style thick-sparse
inactive_text_alpha 0.7

window_border_width   1pt
active_border_color   #e8a8e0
inactive_border_color #b0a8bc

macos_colorspace displayp3
macos_option_as_alt yes
macos_titlebar_color background

enabled_layouts splits

# Copy/paste: EN + RU layout
copy_on_select clipboard
map cmd+c copy_to_clipboard
map cmd+с copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+м paste_from_clipboard
map cmd+a select_all
map cmd+ф select_all

map cmd+t           new_tab_with_cwd
map cmd+enter       launch --location=split --cwd=current
map cmd+\\          launch --location=vsplit --cwd=current
map cmd+shift+enter launch --location=hsplit --cwd=current
map cmd+]           neighboring_window right
map cmd+[           neighboring_window left
map cmd+shift+]     neighboring_window down
map cmd+shift+[     neighboring_window up
